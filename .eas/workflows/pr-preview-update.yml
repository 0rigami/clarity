name: PR preview update

on:
  pull_request:
    branches: ['main']
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  publish_preview:
    name: Publish scan-only PR preview
    # Restrict the trigger and, critically, run PR-controlled bundling in an EAS
    # environment that contains no project variables. Same-repository branches
    # are still untrusted until reviewed, so they must never receive preview,
    # development, or production secrets.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false }}
    type: update
    environment: pr-preview
    env:
      # This selects the preview identifiers/icon without loading the secret-bearing
      # `preview` EAS environment. Add only audited, non-sensitive values here.
      APP_VARIANT: preview
    params:
      # Keep PRs isolated. Publishing to the shared preview channel would update
      # every installed preview build without requiring the reviewer to scan.
      branch: pr-${{ github.event.pull_request.number }}
      platform: all

  comment:
    name: Add preview QR to the PR
    needs: [publish_preview]
    type: github-comment
    params:
      update_group_ids: ['${{ needs.publish_preview.outputs.first_update_group_id }}']
      message: Scan the QR code with a compatible Cadence development build to open this PR preview.
